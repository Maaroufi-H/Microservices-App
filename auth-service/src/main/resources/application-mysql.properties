# Profil MySQL - activer via: spring.profiles.active=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/wellness_auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:wellness}
spring.datasource.password=${MYSQL_PASSWORD:wellness}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
