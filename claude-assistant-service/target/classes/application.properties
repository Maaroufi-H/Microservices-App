spring.application.name=claude-assistant-service
server.port=${PORT:8091}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
spring.cloud.config.enabled=false

# Anthropic API key — set via env var ANTHROPIC_API_KEY (preferred) or this property
anthropic.api-key=${ANTHROPIC_API_KEY:}

# Increase async request timeout for SSE streaming (2 min)
spring.mvc.async.request-timeout=120000

# Actuator
management.endpoints.web.exposure.include=*
