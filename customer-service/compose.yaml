services:
  java-customerservice:
    build:
      context: .
    container_name: java-customerservice
    restart: unless-stopped
    init: true
    ports:
      - "8082:8082"  # Exposed by Dockerfile
    # env_file: ./.env  # Uncomment if .env file exists
    # Add depends_on here if you add external services (e.g., databases)
    # networks: [appnet]  # Uncomment if you add more services and need a custom network

# No external services (databases, caches, etc.) detected in the project structure or Dockerfile.
# No volumes section included, as there are no persistent data requirements for this service.
# No custom networks defined, as there is only one service.
