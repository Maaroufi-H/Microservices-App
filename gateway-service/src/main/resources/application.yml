spring:
  application:
    name: gateway-service
  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: r1
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/customers/**
        - id: r2
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**
        - id: r3
          uri: lb://TRACKING-SERVICE
          predicates:
            - Path=/api/tracking/**
        - id: r4
          uri: lb://RECOMMENDATION-SERVICE
          predicates:
            - Path=/api/recommendations/**
        - id: r5
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**
        - id: r6
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payment/**
        - id: monitoring
          uri: lb://MONITORING-SERVICE
          predicates:
            - Path=/api/monitoring/**
        - id: geolocation
          uri: lb://GEOLOCATION-SERVICE
          predicates:
            - Path=/api/geolocation/**

server:
  port: ${PORT:8088}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
