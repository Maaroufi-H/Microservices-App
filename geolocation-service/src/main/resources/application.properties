spring.application.name=geolocation-service
server.port=8090

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:geolocation-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
spring.cloud.config.enabled=false

# Nominatim (OpenStreetMap) reverse geocoding
# Free, no API key required — only a User-Agent header is mandatory per OSM usage policy
geolocation.nominatim.url=https://nominatim.openstreetmap.org/reverse
geolocation.nominatim.user-agent=microservices-app/1.0 (contact@example.com)

# Actuator
management.endpoints.web.exposure.include=*
