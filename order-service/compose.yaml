services:
  java-orderservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: java-orderservice
    restart: unless-stopped
    init: true
    ports:
      - "8084:8084"  # Exposed by Dockerfile, default Spring Boot port
    # env_file: ./.env  # Uncomment if .env file exists
    networks:
      - appnet
