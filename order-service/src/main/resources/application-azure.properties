# Profil Azure App Service - order-service
server.port=80
eureka.client.service-url.defaultZone=https://wellness-discovery.azurewebsites.net/eureka
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=wellness-order.azurewebsites.net
spring.cloud.config.enabled=false
spring.h2.console.enabled=false

# Kafka -> Azure Event Hubs (injecte via SPRING_KAFKA_BOOTSTRAP_SERVERS)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
