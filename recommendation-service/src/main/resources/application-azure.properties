# Profil Azure App Service - recommendation-service
server.port=80
eureka.client.service-url.defaultZone=https://wellness-discovery.azurewebsites.net/eureka
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=wellness-recommendation.azurewebsites.net
spring.cloud.config.enabled=false

# Azure ML endpoint (injecte via Azure App Settings)
azure.ml.endpoint.url=${AZURE_ML_ENDPOINT_URL:https://YOUR_ENDPOINT.inference.ml.azure.com/score}
azure.ml.endpoint.api-key=${AZURE_ML_ENDPOINT_API_KEY:YOUR_API_KEY}
