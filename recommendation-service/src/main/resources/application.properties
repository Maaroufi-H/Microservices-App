spring.application.name=recommendation-service
server.port=8086

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
spring.cloud.config.enabled=false

# Azure ML endpoint configuration
# Replace these values once your Azure ML real-time endpoint is deployed
azure.ml.endpoint.url=https://YOUR_ENDPOINT.inference.ml.azure.com/score
azure.ml.endpoint.api-key=YOUR_API_KEY
# Number of recommendations to request from the model
azure.ml.recommendations.top-n=10

# Fallback: number of top popular products to return when no ML model is available
app.recommendations.fallback.top-n=10

# Actuator
management.endpoints.web.exposure.include=*
