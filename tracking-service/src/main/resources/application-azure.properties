# ============================================================
# Azure Event Hubs — Kafka-compatible bridge configuration
# Activate with: --spring.profiles.active=azure
# ============================================================

# Replace ${AZURE_EVENT_HUBS_NAMESPACE} with your Azure Event Hubs namespace
spring.kafka.bootstrap-servers=${AZURE_EVENT_HUBS_NAMESPACE}.servicebus.windows.net:9093
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule \
  required username="$ConnectionString" \
  password="${AZURE_EVENT_HUBS_CONNECTION_STRING}";

# Producer: acknowledge all replicas for durability
spring.kafka.producer.acks=all

# Consumer: read from beginning on first start
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka topic for behavior events (routed to Azure Data Lake by domain namespace)
app.kafka.topic.behavior-events=behavior-events

# Kafka topic for order events (used to mark sessions as converted)
app.kafka.topic.order-events=order-events
